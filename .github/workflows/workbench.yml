name: workbench

# Keeps workbench.json fresh for the "workbench" line on the home tab.
# site_built tracks the last commit that touched site content (workbench
# commits touch only this file, so they don't move it); kamirror_updated
# tracks the last commit on the ka-mirror repo, whose daily catalog backups
# land as commits. The json therefore only changes on real upstream events —
# the cron just checks.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workbench

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # recent_work: the three public repos with my latest own commits (bot
      # commits like ka-mirror's backups don't count). Forks, archived repos,
      # repos without a description, and the skip list never show. If the API
      # fails, the previous list stays.
      - name: Write workbench.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site_built=$(git log -1 --format=%cI -- index.html stylesheet.css main.js images/ fonts/ 404.html favicon.svg)
          prev=$(jq -r '.kamirror_updated' workbench.json 2>/dev/null || echo "")
          kamirror=$(curl -sf "https://api.github.com/repos/ankitsxchdeva/ka-mirror/commits?per_page=1" | jq -r '.[0].commit.committer.date' || echo "")
          kamirror=${kamirror:-$prev}

          skip='["ankitsxchdeva.github.io","dots","apps"]'
          recent=$(set -o pipefail
            gh api "users/ankitsxchdeva/repos?sort=pushed&per_page=30" --jq "[.[]
              | select((.fork or .archived) | not)
              | select((.description // \"\") != \"\")
              | select(.name as \$n | $skip | index(\$n) | not)
              | {name, description: (.description | sub(\"\\\\s+$\"; \"\")),
                 url: (if (.homepage // \"\") != \"\" then .homepage else .html_url end)}]" \
            | jq -c '.[]' | while read -r repo; do
                name=$(jq -r .name <<<"$repo")
                date=$(gh api "repos/ankitsxchdeva/$name/commits?author=ankitsxchdeva&per_page=1" --jq '.[0].commit.committer.date // empty')
                if [ -n "$date" ]; then jq -c --arg d "$date" '. + {committed: $d}' <<<"$repo"; fi
              done | jq -s 'sort_by(.committed) | reverse | .[:3]') || recent=""
          if [ -z "$recent" ] || [ "$recent" = "[]" ]; then
            recent=$(jq -c '.recent_work // []' workbench.json 2>/dev/null || echo "[]")
          fi

          jq -n --arg site_built "$site_built" --arg kamirror_updated "$kamirror" --argjson recent_work "$recent" \
            '{site_built: $site_built, kamirror_updated: $kamirror_updated, recent_work: $recent_work}' > workbench.json

      - name: Commit if changed
        run: |
          if git diff --quiet workbench.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workbench.json
          git commit -m "workbench: refresh"
          git push
